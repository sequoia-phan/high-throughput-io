name: Go-Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Serialize runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Go and Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Go application
        run: go test ./...

      - name: Test Rust engine
        working-directory: rust_engine
        run: cargo test --locked

  build-and-publish:
    name: Build and publish container
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/sequoia-phan/high-throughput-io:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-image:
    name: Promote image to homelab
    needs: build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Verify build is from latest main
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main

          LATEST_SHA=$(git rev-parse origin/main)

          if [ "$LATEST_SHA" != "$SOURCE_SHA" ]; then
            echo "Main has advanced since this build."
            echo "Refusing to promote potentially stale image."
            exit 1
          fi

      - name: Update Kustomize image digest
        env:
          IMAGE_DIGEST: ${{ needs.build-and-publish.outputs.image_digest }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(
              "deployments/k3s/overlays/homelab/kustomization.yaml"
          )
          digest = os.environ["IMAGE_DIGEST"]

          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit(f"Invalid image digest: {digest!r}")

          content = path.read_text()

          # This overlay must contain exactly one image digest.
          pattern = r"(?m)^(\s*digest:\s*)sha256:[0-9a-f]{64}(\s*)$"

          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + digest + m.group(2),
              content,
          )

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one digest field, found {count}"
              )

          path.write_text(updated)
          print(f"Promoting image digest: {digest}")
          PY

      - name: Commit and push promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add deployments/k3s/overlays/homelab/kustomization.yaml

          if git diff --cached --quiet; then
            echo "Digest unchanged; nothing to promote."
            exit 0
          fi

          git commit -m "chore(gitops): promote image digest [skip ci]"

          # Integrate newer commits before pushing.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
